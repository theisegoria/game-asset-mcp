name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify

      - name: Audit the publish roster
        run: npm pack --dry-run --json

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -1

      - name: Refuse to continue if Blender is not discoverable
        run: |
          node -e "
          import('./dist/util/blender.js').then(({ findBlender }) => {
            const found = findBlender();
            if (!found) {
              console.error('Blender not discoverable - gated tests would skip');
              process.exit(1);
            }
            console.log('Blender discovered at ' + found);
          });
          "

      - name: Prove Blender can import glTF
        run: >-
          blender --background --factory-startup
          --python-expr "import bpy, numpy; bpy.ops.import_scene.gltf; print('glTF importer and numpy are available')"

      - name: Run the Blender-backed tests
        run: npx vitest run tests/normalize.test.ts

      - name: Prove the Blender-gated tests actually ran
        run: |
          npx vitest run tests/normalize.test.ts --reporter=json --outputFile=blender-results.json
          node .github/scripts/assert-blender-tests-ran.mjs blender-results.json

  macos-app:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Report the native toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the macOS 26 app
        run: swift build --package-path apps/macos/GameDevelopmentStudio

      - name: Test the app model, process boundary, and credential boundary
        run: swift test --package-path apps/macos/GameDevelopmentStudio

      - name: Stage and ad-hoc sign the local app bundle
        run: ./script/build_and_run.sh --build-only

      - name: Validate the staged bundle
        run: |
          plutil -lint apps/macos/GameDevelopmentStudio/dist/GameDevelopmentStudio.app/Contents/Info.plist
          codesign --verify --deep --strict apps/macos/GameDevelopmentStudio/dist/GameDevelopmentStudio.app
