name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.17 is the declared floor; 22 and 24 catch anything that only works
        # on the newest runtime. No native modules, so this matrix is cheap.
        node: ['18.17', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # BEFORE the tests, deliberately: the entry-point test spawns the built
        # server through a symlink and skips itself when dist/ is absent. Left
        # after, that test would quietly stop running the moment the `prepare`
        # script changed — a green suite covering one test fewer than it claims.
        run: npm run build

      - name: Test
        # Skipped on 18.17 ONLY because vitest 4 imports `styleText` from
        # node:util, which arrived in Node 20.12 — a limit of the test runner,
        # not of this package. The 18.17 job still typechecks, lints, builds and
        # completes a real MCP handshake below, which is what actually proves
        # the declared engines floor.
        if: matrix.node != '18.17'
        # No API keys are provided, so nothing here contacts a live provider.
        run: npm test

      - name: Verify the server registers its tools
        # A protocol round-trip, not a version string: a server that fails to
        # register its tools still starts perfectly happily. This runs on EVERY
        # Node in the matrix, including 18.17, so the engines floor is backed by
        # the server actually starting there rather than by assertion.
        run: node scripts/verify-install.mjs

  # ────────────────────────────────────────────────────────────────────────────
  # The Blender-backed tests, actually executed.
  #
  # WHY THIS JOB EXISTS. Every test touching scripts/blender_normalize.py is
  # `describe.skipIf(!haveBlender)`, and no runner above has Blender — so the
  # matrix reported green while never executing a single line of that script.
  # That script is where every data-destruction defect in this project's history
  # has lived: a threshold that ate 98% of a mesh and reported it ready, an
  # inverted scale divisor, a repair silently skipped on any object scaled above
  # 1.0. The suite's most important guards ran only on one developer's laptop.
  #
  # A green CI that never runs the dangerous code is precisely the failure mode
  # this project keeps finding, so this job installs Blender and REFUSES to pass
  # by skipping.
  # ────────────────────────────────────────────────────────────────────────────
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -1

      - name: Refuse to continue if Blender is not discoverable
        # Without this the job would pass BY SKIPPING, which is the exact
        # failure it exists to prevent. findBlender is the same discovery the
        # tests use, so this asserts on the thing that actually gates them.
        run: |
          node -e "
          import('./dist/util/blender.js').then(({ findBlender }) => {
            const found = findBlender();
            if (!found) {
              console.error('Blender not discoverable - the gated tests would silently skip');
              process.exit(1);
            }
            console.log('Blender discovered at ' + found);
          });
          "

      - name: Run the Blender-backed tests, and prove they ran
        # A COUNT, not a status string. Zero tests run means this job proved
        # nothing, and it must fail rather than report success.
        run: |
          npx vitest run tests/normalize.test.ts --reporter=json --outputFile=blender-results.json
          node -e "
          const r = require('./blender-results.json');
          const passed = r.numPassedTests ?? 0;
          const skipped = r.numPendingTests ?? 0;
          console.log('passed=' + passed + ' skipped=' + skipped);
          if (skipped > 0) {
            console.error('Blender tests SKIPPED in the job that exists to run them');
            process.exit(1);
          }
          if (passed === 0) {
            console.error('No Blender tests ran at all');
            process.exit(1);
          }
          "
