name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.17 is the declared floor; 22 and 24 catch anything that only works
        # on the newest runtime. No native modules, so this matrix is cheap.
        node: ['18.17', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # Skipped on 18.17 ONLY because vitest 4 imports `styleText` from
        # node:util, which arrived in Node 20.12 — a limit of the test runner,
        # not of this package. The 18.17 job still typechecks, lints, builds and
        # completes a real MCP handshake below, which is what actually proves
        # the declared engines floor.
        if: matrix.node != '18.17'
        # No API keys are provided, so nothing here contacts a live provider.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the server registers its tools
        # A protocol round-trip, not a version string: a server that fails to
        # register its tools still starts perfectly happily. This runs on EVERY
        # Node in the matrix, including 18.17, so the engines floor is backed by
        # the server actually starting there rather than by assertion.
        run: node scripts/verify-install.mjs
